# Pull requests and pushes to develop or main are checked: the API types against the pinned
# contract, formatting, lint, unit tests, the build, and the Playwright journeys with a mocked API.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A new commit cancels a pull request's previous run; pushes are never cancelled,
# so every commit on develop and main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runs scripts with pipefail; GitHub's default bash -e ignores failures inside a pipeline.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Caches npm by itself, because package.json names npm as its packageManager.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      # schema.ts is committed; it must be what the contract tag in api:types generates.
      - name: Check the API types
        run: |
          npm run api:types
          git diff --exit-code src/app/api/schema.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npx playwright test --forbid-only --retries=1 --reporter=github,html

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
