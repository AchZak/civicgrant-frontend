# Pull requests and pushes to develop or main are checked: the API types against the pinned
# contract, formatting, lint, unit tests, the build, and the Playwright journeys with a mocked API.
# A push to develop then deploys to the test Static Web App.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A new commit cancels a pull request's previous run; pushes are never cancelled,
# so every commit on develop and main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runs scripts with pipefail; GitHub's default bash -e ignores failures inside a pipeline.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Caches npm by itself, because package.json names npm as its packageManager.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      # schema.ts is committed; it must be what the contract tag in api:types generates.
      - name: Check the API types
        run: |
          npm run api:types
          git diff --exit-code src/app/api/schema.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep the build for the deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/civicgrant-frontend/browser
          retention-days: 1

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npx playwright test --forbid-only --retries=1 --reporter=github,html

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The same build everywhere: only config.json differs, written from the environment's variables.
  deploy-tst:
    name: Deploy to test
    needs: [verify, end-to-end]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: tst
      url: https://${{ vars.STATIC_WEB_APP_HOSTNAME }}/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-tst
      cancel-in-progress: false
    steps:
      - name: Get the build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site
          path: site

      - name: Write the runtime configuration
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SPA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          API_SCOPE: ${{ vars.API_SCOPE }}
        run: |
          jq -n \
            --arg license "$PRIMEUI_LICENSE_KEY" \
            --arg apiBaseUrl "$API_BASE_URL" \
            --arg tenantId "$TENANT_ID" \
            --arg clientId "$SPA_CLIENT_ID" \
            --arg apiScope "$API_SCOPE" \
            '{primeUiLicenseKey: $license, apiBaseUrl: $apiBaseUrl,
              entra: {tenantId: $tenantId, clientId: $clientId, apiScope: $apiScope}}' \
            > site/config.json

      # The security policy lets the app call the API, whose host differs per environment.
      - name: Put the API's origin in the security policy
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          jq --arg apiOrigin "${API_BASE_URL%/}" \
            '.globalHeaders |= map_values(split("{apiOrigin}") | join($apiOrigin))' \
            site/staticwebapp.config.json > staticwebapp.config.json
          mv staticwebapp.config.json site/staticwebapp.config.json
          if grep --quiet --fixed-strings '{apiOrigin}' site/staticwebapp.config.json; then
            echo "::error::The security policy still holds the {apiOrigin} placeholder"
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Read at run time with the job's own identity, so no deployment token is stored anywhere.
      - name: Read the deployment token
        id: token
        env:
          STATIC_WEB_APP_NAME: ${{ vars.STATIC_WEB_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          token=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      # A deep link must come back as the app, config.json must name the SPA registration,
      # and the security policy must name the API.
      - name: Check the site
        env:
          SITE: https://${{ vars.STATIC_WEB_APP_HOSTNAME }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          curl --fail --silent --show-error --output /dev/null "$SITE/applications"
          curl --fail --silent --show-error "$SITE/config.json" | jq --exit-status '.entra.clientId != ""' > /dev/null
          curl --fail --silent --show-error --head "$SITE/" \
            | grep --ignore-case '^content-security-policy' \
            | grep --fixed-strings "${API_BASE_URL%/}" > /dev/null
