@if (call.hasValue()) {
  @let fundingCall = call.value();
  <app-page-header [heading]="fundingCall.title | localized" [intro]="fundingCall.reference" />

  <dl class="grid max-w-2xl gap-x-8 gap-y-6 sm:grid-cols-2">
    <div app-detail label="Open for applications from" i18n-label="@@fundingCalls.opensAt">
      {{ fundingCall.opensAt | brusselsDate }}
    </div>
    <div app-detail label="Closes on" i18n-label="@@fundingCalls.closesAt">
      {{ fundingCall.closesAt | brusselsDate }}
    </div>
    <div
      app-detail
      label="Maximum per application"
      i18n-label="@@fundingCalls.maxAmountPerApplication"
    >
      {{ fundingCall.maxAmountPerApplication | currency }}
    </div>
    <div app-detail label="Remaining budget" i18n-label="@@fundingCalls.remainingBudget">
      {{ fundingCall.remainingBudget | currency }}
    </div>
  </dl>
} @else if (call.error(); as error) {
  <app-load-error [error]="error" />
} @else {
  <p-skeleton width="24rem" height="2rem" />
}
