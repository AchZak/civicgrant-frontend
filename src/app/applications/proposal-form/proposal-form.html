<div class="flex flex-col gap-6" *transloco="let t">
  <app-form-row
    [label]="t('applications.fields.title')"
    controlId="project-title"
    [errors]="fields().title().errors()"
  >
    <input
      pInputText
      fluid
      id="project-title"
      aria-describedby="project-title-errors"
      [attr.aria-invalid]="fields().title().invalid()"
      [formField]="fields().title"
    />
  </app-form-row>

  <app-form-row
    [label]="t('applications.fields.description')"
    controlId="project-description"
    [hint]="t('applications.hints.description')"
    [errors]="fields().description().errors()"
  >
    <textarea
      pTextarea
      fluid
      autoResize
      rows="8"
      id="project-description"
      aria-describedby="project-description-hint project-description-errors"
      [attr.aria-invalid]="fields().description().invalid()"
      [formField]="fields().description"
    ></textarea>
  </app-form-row>

  <div class="grid gap-6 sm:grid-cols-2">
    <app-form-row
      [label]="t('applications.fields.requestedAmount')"
      controlId="requested-amount"
      [errors]="fields().requestedAmount().errors()"
    >
      <p-inputnumber
        inputId="requested-amount"
        mode="currency"
        currency="EUR"
        fluid
        ariaDescribedBy="requested-amount-cap requested-amount-errors"
        [locale]="locale()"
        [formField]="fields().requestedAmount"
      />
      @if (capPerApplication(); as cap) {
        <small id="requested-amount-cap" class="text-muted-color">{{
          t('applications.hints.requestedAmount', { amount: (cap | money) })
        }}</small>
      }
    </app-form-row>

    <app-form-row
      [label]="t('applications.fields.totalProjectBudget')"
      controlId="total-project-budget"
      [errors]="fields().totalProjectBudget().errors()"
    >
      <p-inputnumber
        inputId="total-project-budget"
        mode="currency"
        currency="EUR"
        fluid
        ariaDescribedBy="total-project-budget-errors"
        [locale]="locale()"
        [formField]="fields().totalProjectBudget"
      />
    </app-form-row>
  </div>

  <app-form-row
    [label]="t('applications.fields.language')"
    controlId="project-language"
    [errors]="fields().language().errors()"
  >
    <p-select
      inputId="project-language"
      ariaLabelledBy="project-language-label"
      optionLabel="label"
      optionValue="value"
      class="sm:w-1/2"
      [options]="languages()"
      [formField]="fields().language"
    />
  </app-form-row>
</div>
