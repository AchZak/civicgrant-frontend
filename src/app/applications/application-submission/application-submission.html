<ng-container *transloco="let t">
  <div class="rounded-border border border-surface p-6">
    <p class="mb-4 text-muted-color">{{ t('applications.submission.intro') }}</p>
    @if (obstacleKey(); as reason) {
      <p id="submit-obstacle" class="mb-4 font-semibold">{{ t(reason) }}</p>
    }
    <button
      pButton
      type="button"
      [disabled]="obstacleKey() !== undefined || submitting()"
      [attr.aria-describedby]="obstacleKey() === undefined ? null : 'submit-obstacle'"
      (click)="confirmSubmission()"
    >
      <span pButtonLabel>{{ t('applications.submission.actions.submit') }}</span>
    </button>
    @if (problemKey(); as key) {
      <p-message severity="error" class="mt-4">{{ t(key) }}</p-message>
    }
  </div>
</ng-container>
<p-confirmdialog />
