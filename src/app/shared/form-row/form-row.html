<div class="flex flex-col gap-2">
  <label [id]="controlId() + '-label'" [attr.for]="controlId()" class="font-semibold">{{
    label()
  }}</label>
  @if (hint(); as hint) {
    <small [id]="controlId() + '-hint'" class="text-muted-color">{{ hint }}</small>
  }
  <ng-content />
  <app-field-errors [id]="controlId() + '-errors'" [errors]="errors()" />
</div>
