<nav
  *transloco="let t"
  [attr.aria-label]="t('layout.languageSwitch.ariaLabels.navigation')"
  class="flex gap-2"
>
  @for (choice of choices; track choice.language; let last = $last) {
    @if (choice.language === language()) {
      <span aria-current="true" class="font-semibold">{{ choice.code }}</span>
    } @else {
      <button
        type="button"
        class="cursor-pointer text-primary hover:underline"
        [lang]="localeOf[choice.language]"
        [title]="choice.name"
        (click)="choose(choice.language)"
      >
        {{ choice.code }}
      </button>
    }
    @if (!last) {
      <span aria-hidden="true">|</span>
    }
  }
</nav>
